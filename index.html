<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТОП: старт твоего успеха - Хакатон 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">ХАКАТОН 2026</div>
            <ul class="nav-links">
                <li><a href="#about">О хакатоне</a></li>
                <li><a href="#schedule">Расписание</a></li>
                <li><a href="#team">Команда</a></li>
                <li><a href="#contacts">Контакты</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h1>ТОП: старт твоего успеха</h1>
            <h2>Масштабный хакатон для первокурсников ИРИИТ-РТФ</h2>
            
            <div class="timer">
                <div class="timer-block">
                    <span class="timer-value" id="days">00</span>
                    <span class="timer-label">Дней</span>
                </div>
                <div class="timer-block">
                    <span class="timer-value" id="hours">00</span>
                    <span class="timer-label">Часов</span>
                </div>
                <div class="timer-block">
                    <span class="timer-value" id="minutes">00</span>
                    <span class="timer-label">Минут</span>
                </div>
                <div class="timer-block">
                    <span class="timer-value" id="seconds">00</span>
                    <span class="timer-label">Секунд</span>
                </div>
            </div>

            <button class="cta-button">🚀 Принять участие</button>

            <div class="partners">
                <span>Университет</span>
                <span>ПИИ</span>
                <span>АИИ</span>
                <span>СБЕР</span>
                <span>МТС</span>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
